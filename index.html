const sev=(v)=>{const s=String(v||'');return s.includes('紅')?'red':s.includes('黃')?'yellow':s.includes('綠')?'green':'miss'};

function lineChart(labels,values,unit='',color='#0d95a2'){

 const pt=values.map((v,i)=>[L+(labels.length===1?0:(areaW*i/(labels.length-1))),T+areaH-(Number(v)/max)*areaH]);const d=pt.map((p,i)=>`${i?'L':'M'}${p[0]},${p[1]}`).join(' '),fill=`${d} L${pt.at(-1)[0]},${T+areaH} L${L},${T+areaH} Z`;

function stackChart(labels,series,colors=palette,opt={}){

`<div class="card"><div class="card-pad"><div class="card-head"><div><div class="card-title">逐案工程、交付與歸屬</div><div class="card-sub">點選任一建案查看估計、資料限制及原始連結</div></div></div><div class="toolbar"><select class="field" data-filter="projectCompany"><option value="all">所有 CSP</option>${['Microsoft','Amazon','Google','Meta'].map(n=>`<option ${state.projectCompany===n?'selected':''} value="${n}">${n}</option>`).join('')}</select><select class="field" data-filter="projectStatus"><option value="all">所有進度</option>${['建設中','營運','施工中'].map(n=>`<option ${state.projectStatus===n?'selected':''} value="${n}">${n}</option>`).join('')}</select><input class="field search" data-filter="projectSearch" placeholder="搜尋園區、地區或風險…" value="${esc(state.projectSearch)}"></div></div>${bigTable(['公司／園區','地區','估計目前 MW','終局估計 MW','模型目標','工程狀態','風險'],filtered.map(i=>({__row:i.__row,r:i.r})),o=>{const r=o.r;return [`<b>${esc(r[0])}</b><div class="muted">${esc(r[1])}</div>`,esc(r[2]),nf(r[3],0),`<b>${nf(r[4],0)}</b>`,esc(r[5]),esc(r[6]),tag(String(r[8]).split('｜')[0],sev(r[8]))]})}</div>`+
`<div class="info">注意：逐案資料包含同一園區的分期／合作歸屬；本表 MW 不可再加到上方 Epoch 四大 CSP 總計，否則可能重複計數。</div>`;
}
function pageAudit(){const audits=state.auditView==='consistency'?getAudit():state.auditView==='cross'?getChecks():rows('12_延期取消事件').filter(r=>/^E/.test(r[0]));let filtered=audits.filter(r=>state.auditLevel==='all'||{red:'紅',yellow:'黃',green:'綠'}[state.auditLevel]&&r.some(v=>String(v||'').includes({red:'紅',yellow:'黃',green:'綠'}[state.auditLevel])));const rcount=getAudit().filter(r=>sev(r[5])==='red').length,events=rows('12_延期取消事件').filter(r=>/^E/.test(r[0]));
return heading('Risk / Evidence','延期、取消與資料邏輯稽核','正式延期、單一合作取消、模型時點不同及純資料算術更正，依據不同事件性質分開記錄。')+`<div class="metric-grid">${metric('一致性檢查',getAudit().length,'項','含已修正的數字錯誤','B/C')}${metric('歷史更正／紅色檢查',rcount,'項','紅色可能是算術更正而非產業風險','B')}${metric('延期與事件台帳',events.length,'項','涵蓋供應延誤、合作退出與部署規劃','B/C')}${metric('全產業取消比例','—','','缺乏已確定簽約 MW 的完整分母','—')}${metric('投資轉換率','—','','尚無四家逐案已投運與支付額對照','—')}${metric('一致性檢查未清項',getChecks().filter(r=>Number(r[8])===1).length,'項','原檔需複核標記','B/C')}</div>`+
`<div class="card"><div class="card-pad"><div class="card-head"><div><div class="card-title">驗證與事件紀錄</div><div class="card-sub">篩選並逐項檢查原始資料、衝突性質及後續動作</div></div><div class="seg"><button data-action="audit-view" data-mode="consistency" class="${state.auditView==='consistency'?'active':''}">來源一致性</button><button data-action="audit-view" data-mode="cross" class="${state.auditView==='cross'?'active':''}">跨層驗證</button><button data-action="audit-view" data-mode="event" class="${state.auditView==='event'?'active':''}">延期／取消台帳</button></div></div><div class="toolbar"><select class="field" data-filter="auditLevel"><option value="all">所有狀態</option><option value="red" ${state.auditLevel==='red'?'selected':''}>紅色</option><option value="yellow" ${state.auditLevel==='yellow'?'selected':''}>黃色</option><option value="green" ${state.auditLevel==='green'?'selected':''}>綠色</option></select><span class="hint">目前顯示 ${filtered.length} 筆</span></div></div>${state.auditView==='consistency'?bigTable(['ID／主題','訊號 A','訊號 B','分類','處理結果','原始資料'],filtered,r=>[`<b>${esc(r[0])}</b><div class="muted">${esc(r[1])}</div>`,esc(r[2]),esc(r[3]),esc(r[4]),`${tag(String(r[5]).split('｜')[0],sev(r[5]))}<div class="muted">${esc(r[6])}</div>`,link(r[7])]):state.auditView==='cross'?bigTable(['ID／鏈路','對比項目','狀態','分類','驗證結論'],filtered,r=>[`<b>${esc(r[0])}</b><div class="muted">${esc(r[1])}</div>`,esc(r[2]),tag(String(r[3]).split('｜')[0],sev(r[3])),esc(r[4]),esc(r[5])]):bigTable(['事件','公司','日期','事件分類','說明','來源'],filtered,r=>[`<b>${esc(r[2])}</b><div class="muted">${esc(r[0])}</div>`,esc(r[1]),esc(r[3]),esc(r[4]),esc(r[6]),link(r[9])])}</div>`+
section('警報觸發原則','非單一數字判斷，必須有反證及來源')+card('警報條件與升級門檻','紅色表示證據充分的異常或確認的資料更正；不代表整個產業衰退',bigTable(['警報','初階條件','確認條件','注意事項'],rows('05_警示規則').filter(r=>/^R/.test(r[0])),r=>[`<b>${esc(r[1])}</b><div class="muted">${esc(r[0])}</div>`,esc(r[2]),esc(r[4]),esc(r[6])]));
}
function pageSources(){const rs=rows('06_資料來源').filter(r=>/^S/.test(r[0])).filter(r=>String(r.slice(0,7).join(' ')).toLowerCase().includes(state.sourceSearch.toLowerCase()));const methods=rows('08_方法與說明').filter(r=>r[1]);return heading('Data Governance','資料來源、版本及研究方法','來源可追蹤、會計定義可比較、重大更正不覆蓋歷史。此站是從 Excel V2 轉換的可瀏覽研究快照。')+
`<div class="metric-grid">${metric('來源登錄',rows('06_資料來源').filter(r=>/^S/.test(r[0])).length,'筆','包含官方 SEC／IR 與第三方模型','A/B/C')}${metric('跨層查核',getChecks().length,'項','有待複核與口徑解釋','B/C')}${metric('逐案建設紀錄',getProjects().length,'座','基於原 Excel 版本','C')}${metric('資料快照',esc(data.asOf||'2026-11-19'),'','本網站不即時自動抓取財報','—')}</div>`+
`<div class="card"><div class="card-pad"><div class="card-head"><div><div class="card-title">資料來源索引</div><div class="card-sub">點擊來源網址開啟原始披露；請自行核對發布與數據期間</div></div></div><div class="toolbar"><input class="field search" placeholder="搜尋公司、資料來源、資料期間…" data-filter="sourceSearch" value="${esc(state.sourceSearch)}"></div></div>${bigTable(['ID','公司','文件／類型','公布日期','資料期間','可信度','原始來源'],rs,r=>[esc(r[0]),`<b>${esc(r[1])}</b>`,esc(r[2]),esc(r[3]),esc(r[4]),tag(r[5]||'未分級',level(r[5])),link(r[7])])}</div>`+
section('研究與資料更新規範','保持資料歷史與對照分母一致')+card('方法說明','由 Excel「08_方法與說明」轉換',`<div class="source-list">${methods.map(r=>`<div class="source-card"><div><b>${esc(r[0])}</b><p>${esc(r[1])}</p></div></div>`).join('')}</div>`)+
section('匯入新資料','網站可單機使用；匯入同結構 JSON 後更新頁面')+`<div class="card"><div class="card-pad"><div class="card-title">資料版本管理</div><p class="lead" style="margin:8px 0 15px">使用「匯出資料」下載目前 JSON；使用「匯入新版」更新為包含相同工作表結構的新 JSON。更新只保存在這台瀏覽器的 localStorage，不會傳送到外部伺服器，也不會寫回 Excel。</p><div class="toolbar"><button class="btn primary" data-action="import-json">＋ 匯入新版 JSON</button><button class="btn" data-action="export-json">↓ 匯出目前 JSON</button><button class="btn" data-action="reset-data">重設為 V2 基準資料</button></div><div class="notebox">如需公開網址、權限管理、資料庫及排程自動發佈，需要另行部署主機與資料更新管線；本靜態網站不含後端服務。</div></div></div>`;
}
function openProject(idx){const r=getProjects()[Number(idx)]?.r;if(!r)return;let current=Number(r[3]||0),goal=Number(r[4]||0),pct=goal>0?Math.min(100,current/goal*100):0;
 document.getElementById('drawer').innerHTML=`<button class="btn" data-action="close-drawer">✕ 關閉</button><div class="eyebrow" style="margin-top:20px">PROJECT DUE DILIGENCE</div><h2>${esc(r[1])}</h2><div class="sub">${esc(r[0])} · ${esc(r[2])}</div>${tag(r[8],sev(r[8]))}<div class="mini-grid" style="margin:22px 0"><div class="mini-stat"><div class="l">目前 IT MW（估計）</div><div class="v">${nf(current,0)}</div></div><div class="mini-stat"><div class="l">終局 IT MW（模型）</div><div class="v">${nf(goal,0)}</div></div></div><div class="l" style="color:#718797;font-size:12px">目前估計／終局模型容量：${nf(pct,1)}%</div><div class="progressbar"><i style="width:${pct}%"></i></div><p class="foot">此比率只比較第三方 MW 估計，不等於按期交付率或實際 GPU 產能利用率。</p><div style="margin-top:20px">${[['模型目標日期',r[5]],['工程狀態',r[6]],['公司歸屬',r[7]],['證據等級',r[9]],['核驗限制',r[10]]].map(p=>`<div class="pair"><span class="key">${esc(p[0])}</span><span class="val">${esc(p[1])}</span></div>`).join('')}<div class="pair"><span class="key">公司／官方來源</span><span class="val">${link(r[11])}</span></div><div class="pair"><span class="key">模型來源</span><span class="val">${link(r[12])}</span></div></div>`;
 document.getElementById('drawerBackdrop').classList.add('open');}
function render(){const tab=nav.find(n=>n.id===state.tab)||nav[0];document.getElementById('crumb').textContent=tab.name;document.getElementById('sidebarDate').textContent=data.asOf||'未指定';document.getElementById('sidebarVersion').textContent=data.version||'custom';document.getElementById('nav').innerHTML=nav.map((n,i)=>`${n.group?`<div class="nav-label">${esc(n.group)}</div>`:''}<button class="navitem ${state.tab===n.id?'active':''}" data-nav="${n.id}"><span class="ni">${n.icon}</span>${esc(n.name)}</button>`).join('');let content={overview:pageOverview,demand:pageDemand,capex:pageCapex,hardware:pageHardware,capacity:pageCapacity,projects:pageProjects,audit:pageAudit,sources:pageSources}[state.tab]();document.getElementById('page').innerHTML=content+`<div class="footerline"><span>© AI Supply / Demand Observatory · 依來源分級的研究快照</span><span>資料截至 ${esc(data.asOf||'—')} · ${esc(data.version||'custom')} · 不構成投資建議</span></div>`;document.getElementById('sidebar').classList.remove('open');}
function saveData(){try{localStorage.setItem('ai-observatory-snapshot',JSON.stringify(data))}catch(_){}}
function exportData(){const str=JSON.stringify(data,null,2);const blob=new Blob([str],{type:'application/json;charset=utf-8'});const href=URL.createObjectURL(blob);const a=document.createElement('a');a.href=href;a.download=`AI_供需觀測資料_${data.asOf||'snapshot'}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(href),2000)}
const root=document;
root.addEventListener('click',e=>{const target=e.target.closest('[data-action],[data-nav]');if(!target)return;if(target.hasAttribute('data-nav')){state.tab=target.dataset.nav;render();window.scrollTo(0,0);return}const action=target.dataset.action;if(action==='toggle-menu'){document.getElementById('sidebar').classList.toggle('open')}else if(action==='capacity-view'){state.capacityView=target.dataset.mode;render()}else if(action==='audit-view'){state.auditView=target.dataset.mode;state.auditLevel='all';render()}else if(action==='project-detail'){openProject(target.dataset.row)}else if(action==='close-drawer'){document.getElementById('drawerBackdrop').classList.remove('open')}else if(action==='export-json'){exportData()}else if(action==='import-json'){document.getElementById('importFile').click()}else if(action==='reset-data'){if(confirm('確定重設為內建 V2 基準資料？瀏覽器中匯入的新版資料會被取代。')){data=defaultData;try{localStorage.removeItem('ai-observatory-snapshot')}catch(_){}render()}}});
root.addEventListener('input',e=>{const key=e.target.dataset?.filter;if(key){state[key]=e.target.value;const active=document.activeElement,sel=active.selectionStart;render();const n=document.querySelector(`[data-filter="${key}"]`);if(n&&e.target.tagName==='INPUT'){n.focus();try{n.setSelectionRange(sel,sel)}catch(_){}}}});
root.addEventListener('change',e=>{const k=e.target.dataset?.filter;if(k){state[k]=e.target.value;render()}});
document.getElementById('drawerBackdrop').addEventListener('click',e=>{if(e.target.id==='drawerBackdrop')e.target.classList.remove('open')});
document.getElementById('importFile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text());const need=['01_CSP資本支出','03_硬體供應','09_推論需求','10_CSP容量預測','11_資料中心逐案','13_一致性檢查'];if(!obj.sheets||!need.every(k=>Array.isArray(obj.sheets[k])))throw Error('缺少必要工作表資料。請使用儀表板同結構 JSON。');data=obj;saveData();state.tab='overview';render();alert(`資料已更新：${obj.asOf||'未指定日期'}。請確認來源和季度口徑。`)}catch(err){alert(`匯入失敗：${err.message}`)}finally{e.target.value=''}});
render();
})();
</script>
