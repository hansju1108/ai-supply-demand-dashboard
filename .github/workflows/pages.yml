name: Validate and publish AI dashboard
on:
  push:
    branches: [main]
    paths:
      - 'dashboard-data.json'
      - 'index.template.html'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  schedule:
    # Every Friday 09:00 Asia/Taipei (01:00 UTC)
    - cron: '0 1 * * 5'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate snapshot and freshness
        run: python3 scripts/validate_data.py
      - name: Build website
        run: python3 scripts/build_site.py
      - name: Validate dashboard JavaScript
        run: python3 scripts/check_site_js.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - id: deployment
        uses: actions/deploy-pages@v4
